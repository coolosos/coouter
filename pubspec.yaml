name: coouter
description: Declarative routing for Shelf. Type-safe controllers, middleware composition, JSON conversion, and OpenAPI-ready models.
version: 1.0.0

homepage: https://github.com/coolosos/coouter
repository: https://github.com/coolosos/coouter.git
issue_tracker: https://github.com/coolosos/coouter/issues

topics: [shelf, routing, server, http, api]

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  fpdart: ^1.1.0
  equatable: 2.0.8
  mime: ^2.0.0
  meta: ^1.16.0
  coolson: ^1.0.0

dev_dependencies:
  coolint: ^2.1.2
  file: ^7.0.1
  test: ^1.25.0
